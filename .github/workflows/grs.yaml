name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: cleanup profile cards
        run: |
          rm -rf profile/*

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=dracula
          path: profile/stats.svg
          token: ${{ github.token }}
        env:
          GITHUB_TOKEN1: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&theme=dracula
          path: profile/top-langs.svg
          token: ${{ github.token }}
        env:
          GITHUB_TOKEN1: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Generate trophy
        env:
          GITHUB_TOKEN1: ${{ github.token }}
        run: |
          deno run --allow-net --allow-env --allow-read --allow-write \
            .github/scripts/trophy/render_svg.ts "${{ github.repository_owner }}" \
            --file profile/trophy.svg --theme dracula

      - name: Commit cards
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add profile/
          git commit -m "Update README cards" || exit 0
          git push
