name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    environment: profile gen

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: cleanup profile cards
        run: |
          rm -rf profile/*

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=dracula
          path: profile/stats.svg
          token: ${{ github.token }}
        env:
          GITHUB_TOKEN1: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&theme=dracula
          path: profile/top-langs.svg
          token: ${{ github.token }}
        env:
          GITHUB_TOKEN1: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Generate trophy
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: ${{ github.repository_owner }}
          file: profile/trophy.svg
          token: ${{ secrets.TOROPHY_GEN_TOKEN }}
          theme: dracula
        env:
          GITHUB_TOKEN1: ${{ secrets.TOROPHY_GEN_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.TOROPHY_GEN_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add profile/
          git commit -m "Update README cards" || exit 0
          git push
